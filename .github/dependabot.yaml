# No auto-merge here: the auto-merge workflow needs the GitHub App token, which
# only the terraform repo's admin role can read. Dependency PRs are merged by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @astrojs/check (0.9.12) peers on typescript ^5 || ^6, and TS 7 (the
      # native Go port) changes the JS API it drives. Remove this once an
      # @astrojs/check release supports TS 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
