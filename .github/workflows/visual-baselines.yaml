name: Update Visual Baselines
# Re-renders the screenshot baselines in the same container CI compares them in
# and uploads them as an artifact to commit. A separate workflow and job name,
# so a run can never stand in for the required "Browser tests" check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: "Render visual baselines"
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Re-render visual baselines
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots
        env:
          HOME: /root

      - name: Upload visual baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/
