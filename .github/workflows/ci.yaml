name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update-visual-baselines:
        description: "Re-render the visual baselines and upload them as an artifact."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    name: "Static checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run verify

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --offline --root-dir ${{ github.workspace }}/dist dist
          fail: true

  browser:
    name: "Browser tests"
    runs-on: ubuntu-latest
    # Visual baselines are rendered here, in this exact image, so they match
    # run to run. Keep the tag in step with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Browser tests
        if: ${{ !inputs.update-visual-baselines }}
        run: npx playwright test
        env:
          HOME: /root

      - name: Re-render visual baselines
        if: ${{ inputs.update-visual-baselines }}
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots
        env:
          HOME: /root

      - name: Upload visual baselines
        if: ${{ inputs.update-visual-baselines }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/

  lighthouse:
    name: "Lighthouse"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx lhci autorun
